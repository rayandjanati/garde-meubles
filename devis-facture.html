<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Devis / Facture — France Perse Monaco</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #FFFFFF; --ink: #16181C; --muted: #767066; --line: #E7E7E4;
    --blue: #0166FF; --blue-deep: #0057D9; --blue-tint: #EAF1FF; --navy: #0E2A3E;
    --sidebar-bg: #F5F4F0; --sidebar-line: #E1DFD7;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--sidebar-bg); font-family: 'Inter', sans-serif; }

  .layout { display: flex; align-items: flex-start; }
  .formcol { width: 520px; flex-shrink: 0; background: var(--sidebar-bg); color: var(--ink); padding: 32px 30px; border-right: 1px solid var(--sidebar-line); min-height: 100vh; }
  .previewcol { flex: 1; padding: 48px; display: flex; justify-content: center; background: #EDEBE4; min-height: 100vh; }

  .brand-eyebrow { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--blue); margin-bottom: 5px; }
  .form-title { font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; color: var(--ink); margin-bottom: 22px; letter-spacing: -.01em; }

  h2 { font-family: 'Inter', sans-serif; font-size: 11px; margin: 22px 0 10px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); border-bottom: 1px solid var(--sidebar-line); padding-bottom: 7px; font-weight: 700; }
  h2:first-of-type { margin-top: 0; }

  .toggle { display: flex; gap: 4px; margin-bottom: 20px; background: #EAE8E0; padding: 4px; border-radius: 8px; }
  .toggle button { flex: 1; padding: 10px; border: none; background: transparent; color: #8A857A; font-weight: 700; cursor: pointer; border-radius: 6px; font-size: 13px; letter-spacing: .01em; transition: all .15s; font-family: 'Space Grotesk', sans-serif; }
  .toggle button.active { background: var(--blue); color: #fff; box-shadow: 0 2px 6px rgba(5,119,168,.25); }

  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
  .field input, .field textarea {
    width: 100%; padding: 11px 13px; border: 1px solid var(--sidebar-line); border-radius: 7px; font-size: 14.5px;
    font-family: inherit; background: #fff; color: var(--ink);
  }
  .field input:focus, .field textarea:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-tint); }
  .field textarea { resize: vertical; }
  .row2 { display: flex; gap: 8px; }
  .row2 > div { flex: 1; }

  .item-row { display: flex; gap: 6px; margin-bottom: 6px; align-items: center; }
  .item-row input[type=text] { flex: 1; }
  .item-row input[type=number] { width: 92px; }
  .item-row button, .list-row button { background: none; border: none; color: #B5563E; cursor: pointer; font-size: 18px; padding: 2px 8px; }
  .addbtn { background: transparent; border: 1px dashed var(--sidebar-line); border-radius: 7px; padding: 10px 12px; font-size: 13px; cursor: pointer; color: var(--muted); width: 100%; margin-top: 3px; font-weight: 600; }
  .addbtn:hover { border-color: var(--blue); color: var(--blue); }
  .list-row { display: flex; gap: 6px; margin-bottom: 6px; align-items: center; }
  .list-row input { flex: 1; }

  .printbtn { width: 100%; padding: 14px; background: var(--ink); color: #fff; border: none; border-radius: 8px; font-weight: 700; font-size: 14px; letter-spacing: .02em; cursor: pointer; margin-top: 22px; font-family: 'Space Grotesk', sans-serif; }
  .printbtn:hover { background: var(--blue-deep); }

  /* ---------------- PRINTED DOCUMENT ---------------- */
  .page {
    width: 794px; height: 1123px; background: var(--paper); color: var(--ink);
    padding: 0; position: relative; font-family: 'Inter', sans-serif;
    box-shadow: 0 24px 60px rgba(20,24,15,0.18);
    overflow: hidden;
  }
  #page-inner {
    padding: 46px 52px 34px; box-sizing: border-box;
    display: flex; flex-direction: column; min-height: 100%;
    transform-origin: top left;
  }
  .doc-content { flex: 1 0 auto; }

  .doc-header { display: flex; justify-content: space-between; align-items: flex-start; }
  .brandblock { }
  .logo-img { height: 70px; display: block; }
  .company-address { font-size: 10px; color: var(--muted); line-height: 1.6; margin-top: 8px; letter-spacing: .01em; }
  .company-address .divider-dot { color: var(--line); margin: 0 6px; }

  .header-right { text-align: right; }
  .doc-type { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 24px; color: var(--ink); letter-spacing: .02em; text-transform: uppercase; line-height: 1; position: relative; padding-bottom: 10px; }
  .doc-type::after { content: ""; position: absolute; bottom: 0; left: 0; width: 34px; height: 3px; background: var(--blue); }
  .doc-num { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); padding: 0; display: inline-block; margin-top: 8px; letter-spacing: .06em; }
  .doc-num b { color: var(--blue-deep); font-weight: 600; }

  /* Signature divider: a fine hairline that fades at both edges */
  .divider { height: 1px; margin: 22px 0 20px; background: linear-gradient(to right, rgba(22,24,28,0) 0%, var(--line) 14%, var(--line) 86%, rgba(22,24,28,0) 100%); }

  .meta-row { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 18px; }
  .doc-date { font-size: 11.5px; color: var(--muted); text-align: right; }
  .clientbox { text-align: right; font-size: 13px; font-weight: 600; line-height: 1.5; }

  .section-label { font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 700; text-transform: none; letter-spacing: .01em; color: var(--blue); margin-top: 16px; margin-bottom: 6px; }
  .section-label:first-child { margin-top: 0; }
  .body-text { font-size: 12.5px; line-height: 1.55; color: #2B2B27; white-space: pre-wrap; }
  .service-list { font-size: 12.5px; line-height: 1.6; margin: 6px 0; padding-left: 0; list-style: none; color: #2B2B27; }
  .service-list li { position: relative; padding-left: 18px; margin-bottom: 3px; }
  .service-list li::before { content: "—"; position: absolute; left: 0; color: var(--blue); font-weight: 600; }

  table.items { width: calc(100% + 32px); border-collapse: collapse; margin: 12px -16px 4px; font-size: 12.5px; }
  table.items thead td { font-family: 'Space Grotesk', sans-serif; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .09em; color: #fff; background: var(--navy); padding: 9px 16px; }
  table.items td { padding: 8px 16px; vertical-align: top; border-bottom: 1px solid var(--line); color: #2B2B27; }
  table.items tbody tr:nth-child(even) { background: #F4F2EB; }
  table.items td.amt { text-align: right; white-space: nowrap; padding-left: 14px; font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; }

  .totals-wrap { display: flex; justify-content: flex-end; margin-top: 16px; }
  .totals { width: 280px; }
  .totals .line { display: flex; justify-content: space-between; padding: 5px 16px; font-size: 12.5px; color: #444; }
  .totals .line .val { font-family: 'IBM Plex Mono', monospace; }
  .totals .grand { width: calc(100% + 32px); margin: 8px -16px 0; box-sizing: border-box; background: var(--blue-deep); padding: 11px 16px; font-weight: 600; font-size: 12px; color: #fff; font-family: 'Space Grotesk', sans-serif; text-transform: uppercase; letter-spacing: .06em; border: none; border-radius: 3px; }
  .totals .grand .val { font-size: 17px; color: #fff; font-family: 'Space Grotesk', sans-serif; font-weight: 700; letter-spacing: 0; text-transform: none; }

  .payment-note { font-family: 'Space Grotesk', sans-serif; font-weight: 600; color: var(--ink); font-size: 12.5px; letter-spacing: .02em; margin-top: 22px; }
  .special-mention { font-size: 11.5px; font-weight: 600; margin-top: 8px; color: #2B2B27; }
  .devis-terms { font-size: 11.5px; margin-top: 20px; line-height: 1.55; color: #2B2B27; }
  .signature-block { display: flex; justify-content: space-between; margin-top: 22px; font-size: 11.5px; padding-top: 14px; border-top: 1px solid var(--line); }
  .signature-block .role { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 3px; }
  .signature-block .name { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 14px; }
  .signature-block .accord { text-align: right; color: var(--muted); line-height: 1.5; }

  .footer-contact { margin-top: 22px; width: 100%; border-collapse: collapse; table-layout: fixed; }
  .footer-legal {
    margin-top: 10px; text-align: center;
    font-size: 8.5px; letter-spacing: .04em; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px;
  }
  .footer-contact td { width: 33.333%; text-align: center; vertical-align: top; padding: 0 10px; }
  .footer-contact .item { display: inline-flex; align-items: flex-start; gap: 9px; text-align: left; }
  .footer-contact .icon { width: 26px; height: 26px; border-radius: 50%; background: var(--blue-deep); display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px; }
  .footer-contact .icon svg { width: 12px; height: 12px; }
  .footer-contact .txt { font-size: 10px; line-height: 1.4; color: #2B2B27; }
  .footer-contact .txt .lbl { display: block; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 1px; }

  @page { size: A4; margin: 0; }
  @media print {
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; color-adjust: exact !important; }
    body { background: #fff; }
    .formcol { display: none !important; }
    .previewcol { padding: 0; background: none; display: block; }
    .page {
      box-shadow: none; width: 210mm; height: 297mm;
      margin: 0;
    }
    #page-inner { padding: 14mm 16mm; }
    .doc-header, .doc-title-row, .meta-row, table.items, .totals-wrap,
    .signature-block, .footer-contact, .footer-legal { break-inside: avoid; page-break-inside: avoid; }
  }
</style>
</head>

  </div>

</div>

function formatEUR(n){ return (Number(n)||0).toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2}) + " €"; }
function escapeHtml(s){ return String(s||"").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
function boldPhrase(text, phrase){
  const escaped = escapeHtml(text);
  const escapedPhrase = escapeHtml(phrase);
  if (!escapedPhrase || !escaped.includes(escapedPhrase)) return escaped;
  return escaped.split(escapedPhrase).join(`<strong>${escapedPhrase}</strong>`);
}
function formatDateFR(iso){
  if(!iso) return "";
  const d = new Date(iso+"T00:00:00");
  return d.toLocaleDateString("fr-FR", { day:"numeric", month:"long", year:"numeric" });
}

const MIN_NEXT_NUMERO = { devis: 3949, facture: 7833 }; // le prochain numéro réel, d'après l'historique importé

// ---------- Airtable (persistance des compteurs + historique en ligne) ----------
let airtableDocsCache = null; // records loaded from the "Documents" table
let airtableReady = false;

function showBanner(msg){ const b = document.getElementById("banner"); if(b){ b.textContent = msg; b.style.display = "block"; } }
function hideBanner(){ const b = document.getElementById("banner"); if(b) b.style.display = "none"; }

async function airtableRequest({ method="GET", path="", body=null } = {}){
  const url = `https://api.airtable.com/v0/${AIRTABLE_CONFIG.BASE_ID}/${encodeURIComponent(AIRTABLE_CONFIG.TABLE_DOCUMENTS)}${path}`;
  const res = await fetch(url, {
    method,
    headers: { "Authorization": `Bearer ${AIRTABLE_CONFIG.AIRTABLE_TOKEN}`, "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) { const text = await res.text(); throw new Error(`Airtable ${method} → ${res.status}: ${text}`); }
  return res.json();
}

async function loadAirtableDocs(){
  let records = []; let offset = undefined;
  do {
    const path = offset ? `?pageSize=100&offset=${offset}` : `?pageSize=100`;
    const data = await airtableRequest({ path });
    records = records.concat(data.records);
    offset = data.offset;
  } while (offset);
  return records.map(r => ({
    id: r.id,
    type: (r.fields[AIRTABLE_CONFIG.FIELD_TYPE] || "").toLowerCase() === "devis" ? "devis" : "facture",
    numero: r.fields[AIRTABLE_CONFIG.FIELD_NUMERO] || "",
    nom: r.fields[AIRTABLE_CONFIG.FIELD_CLIENT] || "",
  }));
}

async function ensureAirtableLoaded(){
  if (airtableDocsCache) return airtableDocsCache;
  try {
    airtableDocsCache = await loadAirtableDocs();
    airtableReady = true;
    hideBanner();
  } catch(e) {
    console.error(e);
    airtableDocsCache = [];
    airtableReady = false;
    showBanner("Impossible de charger l'historique Airtable — vérifie ton token, ton Base ID et les noms de champs en haut du fichier. Détail : " + e.message);
  }
  return airtableDocsCache;
}

function extractNumeroInt(numeroStr){
  const m = String(numeroStr||"").match(/(\d+)\s*$/);
  return m ? parseInt(m[1], 10) : 0;
}

async function suggestNumero(){
  await ensureAirtableLoaded();
  const year = new Date().getFullYear();
  const historical = HISTORICAL_ARCHIVE[state.type === "devis" ? "devis" : "factures"] || [];
  const fromDocs = (airtableDocsCache || []).filter(d => d.type === state.type);
  const maxHistorical = historical.reduce((m,e) => Math.max(m, extractNumeroInt(e.numero)), 0);
  const maxDocs = fromDocs.reduce((m,e) => Math.max(m, extractNumeroInt(e.numero)), 0);
  const floor = MIN_NEXT_NUMERO[state.type] || 1;
  const next = Math.max(maxHistorical + 1, maxDocs + 1, floor);
  state.numero = `${year}-${String(next).padStart(4,"0")}`;
  renderForm(); renderPreview();
}

function normalizeStr(s){
  return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
}
async function searchClientHistory(query){
  const q = normalizeStr(query);
  if (q.length < 2) return null;
  await ensureAirtableLoaded();
  const docsDevis = (airtableDocsCache || []).filter(d => d.type === "devis");
  const docsFactures = (airtableDocsCache || []).filter(d => d.type === "facture");
  const allDevis = [...HISTORICAL_ARCHIVE.devis, ...docsDevis];
  const allFactures = [...HISTORICAL_ARCHIVE.factures, ...docsFactures];
  const matchDevis = allDevis.filter(e => normalizeStr(e.nom).includes(q));
  const matchFactures = allFactures.filter(e => normalizeStr(e.nom).includes(q));
  return { devis: matchDevis, factures: matchFactures };
}

async function finalizeAndPrint(){
  try {
    if (state.clientNom) {
      const data = await airtableRequest({ method: "POST", body: { fields: {
        [AIRTABLE_CONFIG.FIELD_TYPE]: state.type === "devis" ? "Devis" : "Facture",
        [AIRTABLE_CONFIG.FIELD_NUMERO]: state.numero,
        [AIRTABLE_CONFIG.FIELD_CLIENT]: state.clientNom,
        [AIRTABLE_CONFIG.FIELD_DATE]: state.date,
      }}});
      if (airtableDocsCache) {
        airtableDocsCache.push({ id: data.id, type: state.type, numero: state.numero, nom: state.clientNom });
      }
    }
  } catch(e) {
    console.error(e);
    showBanner("Le document n'a pas pu être enregistré dans l'historique en ligne (le numéro suivant risque de ne pas avancer). Détail : " + e.message);
  }
  window.print();
}

let lookupTimer = null;
function handleClientLookup(value){
  clearTimeout(lookupTimer);
  lookupTimer = setTimeout(async () => {
    const box = document.getElementById("client-lookup");
    if (!box) return;
    const result = await searchClientHistory(value);
    if (!result) { box.innerHTML = ""; return; }
    const totalDevis = result.devis.length, totalFactures = result.factures.length;
    if (totalDevis === 0 && totalFactures === 0) {
      box.innerHTML = `<div style="font-size:12px;color:var(--muted);padding:8px 10px;background:#F2F1EC;border-radius:6px;margin:-4px 0 12px;">Nouveau client — aucun historique trouvé.</div>`;
      return;
    }
    const lastDevis = result.devis.slice(-3).reverse().map(e=>e.numero).join(", ");
    const lastFactures = result.factures.slice(-3).reverse().map(e=>e.numero).join(", ");
    box.innerHTML = `
      <div style="font-size:12px;color:var(--blue-deep);background:var(--blue-tint);padding:8px 10px;border-radius:6px;margin:-4px 0 12px;line-height:1.6;">
        <b>Client existant</b> — ${totalDevis} devis, ${totalFactures} facture${totalFactures>1?"s":""}.<br/>
        ${totalDevis ? `Derniers devis n° ${lastDevis}<br/>` : ""}
        ${totalFactures ? `Dernières factures n° ${lastFactures}` : ""}
      </div>`;
  }, 250);
}

function totalHT(){ return Number(state.montantGlobalHT)||0; }
function totalTVA(){ return totalHT() * (state.tvaRate/100); }
function totalTTC(){ return totalHT() + totalTVA(); }

function renderForm(){
  const f = document.getElementById("form");
  f.innerHTML = `
    <div class="toggle">
      <button class="${state.type==='devis'?'active':''}" onclick="setType('devis')">Devis</button>
      <button class="${state.type==='facture'?'active':''}" onclick="setType('facture')">Facture</button>
    </div>

    <h2>Document</h2>
    <div class="row2">
      <div class="field"><label>Numéro</label><input value="${escapeHtml(state.numero)}" oninput="state.numero=this.value; renderPreview();"/></div>
      <div class="field"><label>Date</label><input type="date" value="${state.date}" oninput="state.date=this.value; renderPreview();"/></div>
    </div>

    <h2>Client</h2>
    <div class="field">
      <label>Nom / Société</label>
      <input id="f-clientNom" value="${escapeHtml(state.clientNom)}" oninput="state.clientNom=this.value; renderPreview(); handleClientLookup(this.value);"/>
    </div>
    <div id="client-lookup"></div>
    <div class="field"><label>Adresse</label><textarea rows="2" oninput="state.clientAdresse=this.value; renderPreview();">${escapeHtml(state.clientAdresse)}</textarea></div>

    ${state.type === 'devis' ? renderDevisFields() : renderFactureFields()}

    <div id="items-list"></div>

    <div class="row2">

  renderItems();

function sectionHeader(label, key){
  const checked = state.sections[key] ? "checked" : "";
  return `<h2 style="display:flex;align-items:center;justify-content:space-between;">
    <span>${label}</span>
    <label style="display:flex;align-items:center;gap:5px;font-size:11px;font-weight:500;text-transform:none;letter-spacing:0;color:#9CA6B4;cursor:pointer;">
      <input type="checkbox" ${checked} onchange="state.sections['${key}']=this.checked; renderForm(); renderPreview();" style="width:auto;accent-color:#0166FF;"/>
      Afficher
    </label>
  </h2>`;
}

function renderDevisFields(){
  return `

      </label>
      <div id="services-list"></div><button class="addbtn" onclick="addService()">+ Ajouter une prestation</button>` : ""}
    ${sectionHeader("Conditions", "conditions")}
    ${state.sections.conditions ? `<div class="field"><textarea rows="4" oninput="state.conditionsPaiement=this.value; renderPreview();">${escapeHtml(state.conditionsPaiement)}</textarea></div>` : ""}

function renderFactureFields(){
  return `
    ${sectionHeader("Référence", "reference")}

function renderItems(){
  const el = document.getElementById("items-list");
  if (!el) return;
  el.innerHTML = state.items.map((it, i) => `
    <div class="list-row">
      <input type="text" placeholder="Description de la prestation" value="${escapeHtml(it)}" oninput="state.items[${i}]=this.value; renderPreview();"/>
      <button onclick="removeItem(${i})">✕</button>
    </div>
  `).join("");
  const svcEl = document.getElementById("services-list");
  if (svcEl) {
    svcEl.innerHTML = state.services.map((s, i) => `
      <div class="list-row">
        <input type="text" value="${escapeHtml(s)}" oninput="state.services[${i}]=this.value; renderPreview();"/>
        <button onclick="removeService(${i})">✕</button>
      </div>
    `).join("");
  }
}

function addItem(){ state.items.push(""); renderItems(); renderPreview(); }
function removeItem(i){ state.items.splice(i,1); renderItems(); renderPreview(); }
function addService(){ state.services.push(""); renderItems(); renderPreview(); }
function removeService(i){ state.services.splice(i,1); renderItems(); renderPreview(); }

function fitPageToOnePage(){
  const pageEl = document.querySelector(".page");
  const inner = document.getElementById("page-inner");
  if (!pageEl || !inner) return;

  // Reset to natural, unscaled state first
  inner.style.transform = "none";
  inner.style.width = "100%";
  pageEl.style.height = "";
  pageEl.style.overflow = "hidden";

  const pageHeight = pageEl.clientHeight;
  const naturalHeight = inner.scrollHeight;

  if (naturalHeight <= pageHeight) {
    return; // fits already, no scaling needed
  }

  const FLOOR = 0.72; // don't shrink text past this, for legibility
  let scale = Math.max(pageHeight / naturalHeight, FLOOR);
  inner.style.width = (100 / scale) + "%";
  const widenedHeight = inner.scrollHeight;
  scale = Math.max(pageHeight / widenedHeight, FLOOR);
  inner.style.width = (100 / scale) + "%";
  inner.style.transform = `scale(${scale})`;

  // If even the minimum scale doesn't fit, don't clip content — let it flow naturally
  if (widenedHeight * scale > pageHeight + 2) {
    pageEl.style.height = "auto";
    pageEl.style.overflow = "visible";
  }
}

window.addEventListener("resize", () => { fitPageToOnePage(); });

function renderDevisBody(){
  return `

  `;
}

(async function init(){ await suggestNumero(); renderForm(); renderPreview(); })();
